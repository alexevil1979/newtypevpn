# ═══════════════════════════════════════════════════════════
# ShadowTunnel — Nginx Reverse Proxy для Admin Panel
#
# Установка:
#   sudo cp nginx/shadowtunnel.conf /etc/nginx/sites-available/
#   sudo ln -s /etc/nginx/sites-available/shadowtunnel.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# ═══════════════════════════════════════════════════════════

# Rate limiting
limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=10r/s;

server {
    listen 443 ssl http2;
    server_name admin.shadowtunnel.local;

    # SSL — замените на ваши сертификаты (Let's Encrypt рекомендуется)
    ssl_certificate     /etc/shadowtunnel/admin.crt;
    ssl_certificate_key /etc/shadowtunnel/admin.key;

    # Современные TLS-настройки
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;

    # Заголовки безопасности
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Ограничение размера тела запроса
    client_max_body_size 1m;

    # Rate limiting
    limit_req zone=admin_limit burst=20 nodelay;

    # Доступ только с определённых IP (раскомментируйте и настройте)
    # allow 10.0.0.0/8;
    # allow 192.168.0.0/16;
    # deny all;

    location / {
        proxy_pass https://127.0.0.1:8443;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Таймауты
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Блокировка доступа к скрытым файлам
    location ~ /\. {
        deny all;
        return 404;
    }

    # Логи
    access_log /var/log/nginx/shadowtunnel-admin-access.log;
    error_log  /var/log/nginx/shadowtunnel-admin-error.log;
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name admin.shadowtunnel.local;
    return 301 https://$server_name$request_uri;
}
