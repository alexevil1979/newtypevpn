<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ShadowTunnel Admin{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
    {% block head %}{% endblock %}
</head>
<body>
    {% if user %}
    <nav class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <span class="logo-icon">&#9783;</span>
                <span class="logo-text">ShadowTunnel</span>
            </div>
        </div>
        <ul class="nav-links">
            <li><a href="/" class="{% if request.url.path == '/' %}active{% endif %}">
                <span class="nav-icon">&#9632;</span> Dashboard
            </a></li>
            <li><a href="/clients" class="{% if request.url.path == '/clients' %}active{% endif %}">
                <span class="nav-icon">&#9687;</span> Clients
            </a></li>
        </ul>
        <div class="sidebar-footer">
            <span class="user-badge">{{ user }}</span>
            <a href="/logout" class="logout-btn">Logout</a>
        </div>
    </nav>
    {% endif %}

    <main class="{% if user %}content{% else %}content-full{% endif %}">
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
